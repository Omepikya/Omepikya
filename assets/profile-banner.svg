<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Omepikya — Product Builder</title>
  <desc id="desc">Building practical software for web, Android and intelligent systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow)"/>
  <circle cx="1030" cy="80" r="120" fill="none" stroke="#93c5fd" stroke-opacity=".12" stroke-width="2"/>
  <circle cx="1030" cy="80" r="78" fill="none" stroke="#93c5fd" stroke-opacity=".10" stroke-width="2"/>
  <circle cx="1030" cy="80" r="36" fill="#60a5fa" fill-opacity=".08" stroke="#93c5fd" stroke-opacity=".18"/>
  <text x="76" y="112" fill="#93c5fd" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" letter-spacing="4">OMEPIKYA</text>
  <text x="76" y="178" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="800">Building useful software.</text>
  <text x="76" y="220" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="21">Web · Android · Cloud · Intelligent systems</text>
  <line x1="76" y1="270" x2="380" y2="270" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
  <text x="76" y="308" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="17">Design it. Build it. Improve it.</text>
